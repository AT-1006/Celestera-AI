name: ai_chatbot

description: A fully-featured AI chatbot mobile application

publish_to: 'none'

version: 1.0.0+1



environment:

  sdk: '>=3.0.0 <4.0.0'



dependencies:

  flutter:

    sdk: flutter

  

  # UI Components

  cupertino_icons: ^1.0.2

  google_fonts: ^6.1.0

  flutter_svg: ^2.0.9

    # State Management

  provider: ^6.1.1

  

  # Storage

  shared_preferences: ^2.2.2

  path_provider: ^2.1.1

  firebase_storage: ^11.0.3

  

  # Authentication

  firebase_core: ^2.3.0

  firebase_auth: ^4.3.8

  cloud_firestore: ^4.3.5

  google_sign_in: ^6.0.0

  

  # HTTP & API

  http: ^1.1.2

  dio: ^5.4.0

  

  # Image Handling

  image_picker: ^1.0.5

  cached_network_image: ^3.3.0

  

  # Local Database

  sqflite: ^2.3.0

  

  # Voice & Audio

  speech_to_text: ^7.0.0

  flutter_tts: ^3.8.5

  permission_handler: ^11.3.1

  

  # Biometric & Security

  local_auth: ^2.1.7

  flutter_secure_storage: ^8.0.0

  

  # Utils

  intl: ^0.18.1

  uuid: ^4.2.2

  url_launcher: ^6.2.2



dev_dependencies:

  flutter_test:

    sdk: flutter

  flutter_launcher_icons: ^0.13.1



flutter_launcher_icons:

  android: "ic_launcher"

  ios: true

  image_path: "assets/images/celesteraicon.png"

  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"

  adaptive_icon_foreground: "assets/images/celesteraicon.png"

  remove_alpha_ios: true



flutter:

  uses-material-design: true

  

  assets:

    - assets/images/

    - assets/icons/

    - assets/images/celesteraicon.png  # App logo



  fonts:

    - family: SpaceMatic               # Space Matic font for CELESTERA title

      fonts:

        - asset: assets/fonts/Space Matic.otf